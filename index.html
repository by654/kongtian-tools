<style>
  body.kt-booting{overflow:hidden}
  #kt-boot{
    position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(520px 320px at 78% 8%,rgba(129,140,248,.18),transparent 70%),
      radial-gradient(420px 280px at 12% 86%,rgba(34,211,238,.12),transparent 70%),
      #070b14;
    color:#e9eefc;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    opacity:1;transition:opacity .42s ease;
  }
  #kt-boot.done{opacity:0;pointer-events:none}
  #kt-boot::before{
    content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
    background-image:
      radial-gradient(1.4px 1.4px at 18% 22%,#fff,transparent),
      radial-gradient(1px 1px at 33% 68%,#b9e9ff,transparent),
      radial-gradient(1.2px 1.2px at 57% 18%,#fff,transparent),
      radial-gradient(1px 1px at 71% 58%,#d8d4ff,transparent),
      radial-gradient(1.3px 1.3px at 86% 32%,#fff,transparent),
      radial-gradient(1px 1px at 44% 84%,#a5f3fc,transparent);
    background-repeat:no-repeat;
  }
  .kt-boot-card{
    position:relative;width:min(420px,86vw);padding:30px 26px 24px;text-align:center;
    border:1px solid rgba(255,255,255,.1);border-radius:20px;
    background:rgba(14,22,38,.74);backdrop-filter:blur(16px);
    box-shadow:0 24px 70px rgba(0,0,0,.5);
  }
  .kt-boot-logo{width:78px;height:78px;margin:0 auto 12px;position:relative}
  .kt-boot-logo svg{width:100%;height:100%;animation:ktSpin 22s linear infinite;filter:drop-shadow(0 0 14px rgba(56,205,240,.35))}
  @keyframes ktSpin{to{transform:rotate(360deg)}}
  .kt-boot-card h1{font-size:20px;margin:0 0 4px;letter-spacing:.5px}
  .kt-boot-card .sub{font-size:9.5px;letter-spacing:2.2px;color:#8b9bb8;font-weight:600;margin-bottom:16px}
  .kt-boot-status{font-size:12.5px;color:#c3cfe6;margin:0 0 12px}
  .kt-boot-bar{height:8px;border-radius:10px;background:rgba(255,255,255,.08);overflow:hidden}
  .kt-boot-bar i{
    display:block;height:100%;width:0;border-radius:10px;
    background:linear-gradient(90deg,#22d3ee,#818cf8,#c084fc);
    transition:width .28s ease;
    box-shadow:0 0 14px rgba(56,205,240,.55);
  }
  .kt-boot-meta{display:flex;justify-content:space-between;gap:10px;font-size:10.5px;color:#8b9bb8;margin-top:8px}
  .kt-boot-hint{font-size:11px;color:#66748d;line-height:1.6;margin-top:14px;min-height:34px}
  .kt-boot-retry{
    margin-top:12px;padding:8px 18px;border-radius:9px;border:1px solid rgba(56,205,240,.35);
    background:rgba(56,205,240,.12);color:#67e8f9;font:inherit;font-size:12.5px;cursor:pointer;
  }
  @media (prefers-reduced-motion:reduce){
    .kt-boot-logo svg{animation:none}
    #kt-boot{transition:none}
    .kt-boot-bar i{transition:none}
  }
</style>

<script>
(function(){
  var boot = document.getElementById('kt-boot');
  var fill = document.getElementById('kt-boot-fill');
  var pct = document.getElementById('kt-boot-pct');
  var status = document.getElementById('kt-boot-status');
  var hint = document.getElementById('kt-boot-hint');
  var retry = document.getElementById('kt-boot-retry');
  var bar = document.getElementById('kt-boot-bar');
  if (!boot || !fill) return;
  var target = 8, current = 0, ready = false, hidden = false, slow = false;
  var start = Date.now();
  var css = document.getElementById('app-css');
  var main = document.getElementById('main-script');
  if (css) css.addEventListener('load', function(){ target = Math.max(target, 32); });
  if (main) main.addEventListener('load', function(){ target = Math.max(target, 66); });
  if (window.PerformanceObserver) {
    try {
      new PerformanceObserver(function(list){
        list.getEntries().forEach(function(e){
          if (e.initiatorType === 'script' || e.initiatorType === 'link' || e.initiatorType === 'css') {
            target = Math.min(88, target + 3);
          }
        });
      }).observe({ entryTypes: ['resource'] });
    } catch (e) {}
  }
  function finish() {
    if (hidden) return;
    hidden = true;
    var wait = Math.max(0, 650 - (Date.now() - start));
    setTimeout(function(){
      boot.classList.add('done');
      boot.setAttribute('aria-busy', 'false');
      document.body.classList.remove('kt-booting');
      setTimeout(function(){ if (boot.parentNode) boot.parentNode.removeChild(boot); }, 480);
    }, wait);
  }
  function loop() {
    if (hidden) return;
    current += (target - current) * 0.1;
    if (target - current < 0.4) current = target;
    if (ready && current > 99.4) current = 100;
    var p = Math.round(current);
    fill.style.width = p + '%';
    pct.textContent = p + '%';
    bar.setAttribute('aria-valuenow', p);
    status.textContent = p < 28 ? '正在加载界面样式…' : p < 60 ? '正在加载工具索引…' : p < 96 ? '正在准备首页…' : '准备完成';
    if (ready && p >= 100) { finish(); return; }
  }
  window.addEventListener('kt:ready', function(){
    ready = true;
    target = 100;
    hint.textContent = '加载完成，正在进入…';
  });
  window.addEventListener('load', function(){
    if (!ready) target = Math.max(target, 70);
  });
  setInterval(function(){
    if (hidden || ready) return;
    target = Math.min(92, target + 0.8);
    if (!slow && Date.now() - start > 15000) {
      slow = true;
      hint.textContent = '网络似乎有点慢，正在继续加载，请再稍候一会儿…';
    }
    if (Date.now() - start > 30000) {
      retry.hidden = false;
      hint.textContent = '加载时间较长，可以检查网络，或点击下方按钮重新加载。';
    }
  }, 900);
  window.addEventListener('error', function(e){
    if (ready || hidden) return;
    if (e.target && (e.target.tagName === 'LINK' || e.target.tagName === 'SCRIPT')) {
      status.textContent = '资源加载失败';
      hint.textContent = '请检查网络连接后点击重新加载。';
      retry.hidden = false;
    }
  }, true);
  retry.addEventListener('click', function(){ location.reload(); });
  (function tick(){ loop(); if (!hidden) requestAnimationFrame(tick); })();
})();
</script>
